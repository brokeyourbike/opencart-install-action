name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencart
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping"

    steps:
      - uses: actions/checkout@v6

      - uses: brokeyourbike/setup-opencart-action@v1
        with:
          oc-version: '4.1.0.3'
          db-password: 'root'
          admin-password: 'admin_pass'

            - name: Generate Dummy .ocmod.zip
        run: |
          mkdir -p dummy_ext/upload/extension/my_vendor/module/
          # Changed to .php
          echo "<?php // TS ACTION WORKS" > dummy_ext/upload/extension/my_vendor/module/ts_test.php
          
          cat <<EOF > dummy_ext/install.json
          {
            "name": "Dummy Extension",
            "version": "1.0",
            "author": "Ivan Stasiuk",
            "link": "https://example.com"
          }
          EOF
          
          cd dummy_ext
          zip -r ../dummy.ocmod.zip upload/ install.json

      - name: Install Extension
        uses: ./
        with:
          store-url: 'http://localhost:8080'
          admin-username: 'admin'
          admin-password: 'admin_pass'
          zip-path: './dummy.ocmod.zip'

      - name: Debug Extraction Output
        if: always()
        run: |
          echo "--- Root Extension Folder ---"
          docker exec opencart-server ls -la /var/www/html/extension/ || true
          
          echo "--- Checking Vendor Folder ---"
          docker exec opencart-server ls -la /var/www/html/extension/my_vendor/ || true
          
          echo "--- Checking Module Folder ---"
          docker exec opencart-server ls -la /var/www/html/extension/my_vendor/module/ || true
          
          echo "--- OpenCart Storage (Uploads) ---"
          docker exec opencart-server ls -la /var/www/html/system/storage/marketplace/ || true

      - name: Verify Physical Extraction
        run: |
          docker exec opencart-server cat /var/www/html/extension/my_vendor/module/ts_test.php | grep "TS ACTION WORKS"